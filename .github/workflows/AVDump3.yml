name: AVDump3

on:
  push:
    tags: [ 'B[0-9]+-GitHubRelease' ]
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-avd3native-deps:
    name: deps/AVD3Native
    uses: ./.github/workflows/AVD3Native.yml

  build-mediainfo-deps:
    name: deps/MediaInfo
    uses: ./.github/workflows/MediaInfo.yaml

  build-avd3-main:
    needs: [build-avd3native-deps, build-mediainfo-deps]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: AVD3Main-Checkout
      uses: actions/checkout@v4
      
    - name: AVD3Main-DotNetSetup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: AVD3Main-Compile (restore only)
      run: dotnet restore AVDump3CL/AVDump3CL.csproj

    - name: Prepare output folder
      run: |
        mkdir -p "$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"

    - name: Download native artifact (Linux x64)
      uses: actions/download-artifact@v4
      with:
        name: AVDump3NativeLib.Linux.x64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download native artifact (Linux arm64)
      uses: actions/download-artifact@v4
      with:
        name: AVDump3NativeLib.Linux.arm64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download native artifact (Windows x64)
      uses: actions/download-artifact@v4
      with:
        name: AVDump3NativeLib.Windows
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download MediaInfo (Windows x64)
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.win-x64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download MediaInfo (Linux x64)
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.linux-x64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download MediaInfo (Linux arm64)
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.linux-arm64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download MediaInfo (Linux musl x64)
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.linux-musl-x64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Download MediaInfo (Linux musl arm64)
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.linux-musl-arm64
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

    - name: Normalize dependency filenames and prune extras
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"
        # Normalize MediaInfo file names
        # Native lib artifact names already come with RIDs from dependency workflows; just rename to expected release names
        [ -f "$out/AVDump3NativeLib-linux-x64.so" ] || [ -f "$out/AVDump3NativeLib.Linux.x64" ] && mv -f "$out"/AVDump3NativeLib.Linux.x64 "$out"/AVDump3NativeLib-linux-x64.so 2>/dev/null || true
        [ -f "$out/AVDump3NativeLib-linux-arm64.so" ] || [ -f "$out/AVDump3NativeLib.Linux.arm64" ] && mv -f "$out"/AVDump3NativeLib.Linux.arm64 "$out"/AVDump3NativeLib-linux-arm64.so 2>/dev/null || true
        [ -f "$out/AVDump3NativeLib-windows-x64.dll" ] || [ -f "$out/AVDump3NativeLib.dll" ] && mv -f "$out"/AVDump3NativeLib.dll "$out"/AVDump3NativeLib-windows-x64.dll 2>/dev/null || true

        # MediaInfo artifacts: ensure naming matches expected list
        [ -f "$out/MediaInfo-windows-x64.dll" ] || [ -f "$out/MediaInfo.dll" ] && mv -f "$out"/MediaInfo.dll "$out"/MediaInfo-windows-x64.dll 2>/dev/null || true
        [ -f "$out/MediaInfo-linux-x64.so" ] || [ -f "$out/MediaInfo.linux-x64.so" ] && mv -f "$out"/MediaInfo.linux-x64.so "$out"/MediaInfo-linux-x64.so 2>/dev/null || true
        [ -f "$out/MediaInfo-linux-arm64.so" ] || [ -f "$out/MediaInfo.linux-arm64.so" ] && mv -f "$out"/MediaInfo.linux-arm64.so "$out"/MediaInfo-linux-arm64.so 2>/dev/null || true
        # musl variants may be named with musl between arch tokens in artifacts; normalize both dotted and hyphenated forms
        if [ ! -f "$out/MediaInfo-linux-x64-musl.so" ]; then
          [ -f "$out/MediaInfo.linux-musl-x64.so" ] && mv -f "$out/MediaInfo.linux-musl-x64.so" "$out/MediaInfo-linux-x64-musl.so" || true
          [ -f "$out/MediaInfo-linux-musl-x64.so" ] && mv -f "$out/MediaInfo-linux-musl-x64.so" "$out/MediaInfo-linux-x64-musl.so" || true
        fi
        if [ ! -f "$out/MediaInfo-linux-arm64-musl.so" ]; then
          [ -f "$out/MediaInfo.linux-musl-arm64.so" ] && mv -f "$out/MediaInfo.linux-musl-arm64.so" "$out/MediaInfo-linux-arm64-musl.so" || true
          [ -f "$out/MediaInfo-linux-musl-arm64.so" ] && mv -f "$out/MediaInfo-linux-musl-arm64.so" "$out/MediaInfo-linux-arm64-musl.so" || true
        fi

    - name: Verify required dependency payload
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"
        echo "Final payload in $out:" && ls -la "$out"
        missing=()
        req=(
          AVDump3NativeLib-linux-arm64.so
          AVDump3NativeLib-linux-x64.so
          AVDump3NativeLib-windows-x64.dll
          MediaInfo-linux-arm64.so
          MediaInfo-linux-arm64-musl.so
          MediaInfo-linux-x64.so
          MediaInfo-linux-x64-musl.so
          MediaInfo-windows-x64.dll
        )
        for f in "${req[@]}"; do
          [ -f "$out/$f" ] || missing+=("$f")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "ERROR: Missing required files:" >&2
          printf ' - %s\n' "${missing[@]}" >&2
          echo 
          echo "Available files:" && ls -1 "$out"
          exit 1
        fi

    - name: Publish CLI for multiple RIDs
      run: |
        set -euo pipefail
        base="$GITHUB_WORKSPACE/AVDump3CL"
        pub="$base/publish"
        mkdir -p "$pub/win-x64" "$pub/linux-x64" "$pub/linux-arm64" "$pub/linux-musl-x64" "$pub/linux-musl-arm64"
        # Publish framework-dependent executables per RID
        dotnet publish "$base/AVDump3CL.csproj" -c Release -r win-x64 -o "$pub/win-x64" --no-self-contained
        dotnet publish "$base/AVDump3CL.csproj" -c Release -r linux-x64 -o "$pub/linux-x64" --no-self-contained
        dotnet publish "$base/AVDump3CL.csproj" -c Release -r linux-arm64 -o "$pub/linux-arm64" --no-self-contained
        dotnet publish "$base/AVDump3CL.csproj" -c Release -r linux-musl-x64 -o "$pub/linux-musl-x64" --no-self-contained
        dotnet publish "$base/AVDump3CL.csproj" -c Release -r linux-musl-arm64 -o "$pub/linux-musl-arm64" --no-self-contained

    - name: Copy native and MediaInfo libs into published outputs
      run: |
        set -euo pipefail
        stage="$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"
        pub="$GITHUB_WORKSPACE/AVDump3CL/publish"
        # Windows x64
        cp -f "$stage/AVDump3NativeLib-windows-x64.dll" "$pub/win-x64/" 2>/dev/null || true
        cp -f "$stage/MediaInfo-windows-x64.dll" "$pub/win-x64/" 2>/dev/null || true
        # Linux x64
        cp -f "$stage/AVDump3NativeLib-linux-x64.so" "$pub/linux-x64/" 2>/dev/null || true
        cp -f "$stage/MediaInfo-linux-x64.so" "$pub/linux-x64/" 2>/dev/null || true
        # Linux arm64
        cp -f "$stage/AVDump3NativeLib-linux-arm64.so" "$pub/linux-arm64/" 2>/dev/null || true
        cp -f "$stage/MediaInfo-linux-arm64.so" "$pub/linux-arm64/" 2>/dev/null || true
        # Linux musl x64 (reuse native glibc lib if musl variant not provided)
        cp -f "$stage/AVDump3NativeLib-linux-x64.so" "$pub/linux-musl-x64/" 2>/dev/null || true
        cp -f "$stage/MediaInfo-linux-x64-musl.so" "$pub/linux-musl-x64/" 2>/dev/null || true
        # Linux musl arm64 (reuse native glibc lib if musl variant not provided)
        cp -f "$stage/AVDump3NativeLib-linux-arm64.so" "$pub/linux-musl-arm64/" 2>/dev/null || true
        cp -f "$stage/MediaInfo-linux-arm64-musl.so" "$pub/linux-musl-arm64/" 2>/dev/null || true

    - name: Verify published executables exist
      run: |
        set -euo pipefail
        pub="$GITHUB_WORKSPACE/AVDump3CL/publish"
        req=(
          "$pub/win-x64/AVDump3CL.exe"
          "$pub/linux-x64/AVDump3CL"
          "$pub/linux-arm64/AVDump3CL"
          "$pub/linux-musl-x64/AVDump3CL"
          "$pub/linux-musl-arm64/AVDump3CL"
        )
        missing=()
        for p in "${req[@]}"; do
          [ -f "$p" ] || missing+=("$p")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "ERROR: Missing published executables:" >&2
          printf ' - %s\n' "${missing[@]}" >&2
          exit 1
        fi
        echo "Published outputs:" && find "$pub" -maxdepth 2 -type f -printf '%P\n' | sort

    - name: AVD3Main-ArtifactUpload
      uses: actions/upload-artifact@v4
      with:
        name: AVDump3CL
        path: ${{ github.workspace }}/AVDump3CL/publish/

  release-avd3-main:
    if: contains(github.ref, 'tags/B')
    runs-on: ubuntu-latest
    needs: build-avd3-main

    steps:
    - name: AVD3Release-DownloadArtifacts
      uses: actions/download-artifact@v4
      with:
        name: AVDump3CL
        path: ${{ github.workspace }}/AVDump3CL

    - name: AVD3Release-GetTag
      id: avd3releasegettag
      uses: olegtarasov/get-tag@v2.1.4
      with:
        tagRegex: "B(\\d+)"
      
    - name: AVD3Release-CompressAsset
      run: |
        cd ${{ github.workspace }}/AVDump3CL
        zip -r ${{ github.workspace }}/AVDump3CL-B${{ steps.avd3releasegettag.outputs.tag }}.zip *
     
    - name: AVD3Release-Create
      id: avd3releasecreate
      uses: softprops/action-gh-release@v2
      with:
        name: Build ${{ steps.avd3releasegettag.outputs.tag }}
        draft: true
        prerelease: true
        files: ${{ github.workspace }}/AVDump3CL-B${{ steps.avd3releasegettag.outputs.tag }}.zip
