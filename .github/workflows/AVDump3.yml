name: AVDump3

on:
  push:
    tags: [ 'B[0-9]+-GitHubRelease' ]
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-avd3-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: AVD3Main-Checkout
      uses: actions/checkout@v4
      
    - name: AVD3Main-DotNetSetup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: AVD3Main-Compile
      run: dotnet build AVDump3CL/AVDump3CL.csproj --configuration Release

    - name: Fetch AVD3Native artifacts from latest successful run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dest="$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"
        mkdir -p "$dest"
        # Try current ref_name, then NET10, then master
        for br in "${{ github.ref_name }}" NET10 master; do
          run_id=$(gh api \
            repos/${{ github.repository }}/actions/workflows/AVD3Native.yml/runs \
            -f branch="$br" -f status=success \
            --jq '.workflow_runs[0].id' || true)
          [ -n "${run_id:-}" ] && echo "Found AVD3Native run on branch $br: $run_id" && break
        done
        if [ -z "${run_id:-}" ]; then
          echo "No successful AVD3Native run found on branch ${{ github.ref_name }}."
          exit 1
        fi
        echo "Using AVD3Native run_id=$run_id"
        for name in \
          AVDump3NativeLib.Linux.x64 \
          AVDump3NativeLib.Linux.arm64 \
          AVDump3NativeLib.MacOS \
          AVDump3NativeLib.Windows; do
          gh run download "$run_id" -n "$name" -D "$dest" || true
        done
        # Flatten any artifact subfolders
        find "$dest" -type f -mindepth 1 -maxdepth 3 -print -exec mv -f {} "$dest" \;
        find "$dest" -type d -mindepth 1 -maxdepth 3 -empty -delete || true

    - name: Fetch MediaInfo artifacts from latest successful run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        dest="$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"
        mkdir -p "$dest"
        # Try current ref_name, then NET10, then master, then mediainfo branch (for this workflow)
        for br in "${{ github.ref_name }}" NET10 master mediainfo; do
          run_id=$(gh api \
            repos/${{ github.repository }}/actions/workflows/MediaInfo.yaml/runs \
            -f branch="$br" -f status=success \
            --jq '.workflow_runs[0].id' || true)
          [ -n "${run_id:-}" ] && echo "Found MediaInfo run on branch $br: $run_id" && break
        done
        if [ -z "${run_id:-}" ]; then
          echo "No successful MediaInfo run found on branch ${{ github.ref_name }}."
          exit 1
        fi
        echo "Using MediaInfo run_id=$run_id"
        # Download all MediaInfo.* artifacts we might publish
        for name in \
          MediaInfo.win-x64 \
          MediaInfo.osx-universal \
          MediaInfo.osx-x64 \
          MediaInfo.osx-arm64 \
          MediaInfo.linux-x64 \
          MediaInfo.linux-arm64 \
          MediaInfo.linux-musl-x64 \
          MediaInfo.linux-musl-arm64; do
          gh run download "$run_id" -n "$name" -D "$dest" || true
        done
        # Flatten any artifact subfolders
        find "$dest" -type f -mindepth 1 -maxdepth 3 -print -exec mv -f {} "$dest" \;
        find "$dest" -type d -mindepth 1 -maxdepth 3 -empty -delete || true

    - name: Normalize dependency filenames and prune extras
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/AVDump3CL/bin/Release/net10.0"
        # Normalize MediaInfo file names
        if [ -f "$out/MediaInfo.dll" ]; then
          mv -f "$out/MediaInfo.dll" "$out/MediaInfo-windows-x64.dll"
        fi
        # musl naming consistency: also provide -x64-musl and -arm64-musl
        [ -f "$out/MediaInfo-linux-musl-x64.so" ] && cp -f "$out/MediaInfo-linux-musl-x64.so" "$out/MediaInfo-linux-x64-musl.so"
        [ -f "$out/MediaInfo-linux-musl-arm64.so" ] && cp -f "$out/MediaInfo-linux-musl-arm64.so" "$out/MediaInfo-linux-arm64-musl.so"
        # provide extensionless arm64 variant if expected
        [ -f "$out/MediaInfo-linux-arm64.so" ] && cp -f "$out/MediaInfo-linux-arm64.so" "$out/MediaInfo-linux-arm64"
        # Remove macOS libs from the CLI release (not listed as expected)
        rm -f "$out"/AVDump3NativeLib-osx*.dylib "$out"/MediaInfo-*.dylib || true

    - name: AVD3Main-ArtifactUpload
      uses: actions/upload-artifact@v4
      with:
        name: AVDump3CL
        path: ${{ github.workspace }}/AVDump3CL/bin/Release/net10.0/

  release-avd3-main:
    if: contains(github.ref, 'tags/B')
    runs-on: ubuntu-latest
    needs: build-avd3-main

    steps:
    - name: AVD3Release-DownloadArtifacts
      uses: actions/download-artifact@v4
      with:
        name: AVDump3CL
        path: ${{ github.workspace }}/AVDump3CL

    - name: AVD3Release-GetTag
      id: avd3releasegettag
      uses: olegtarasov/get-tag@v2.1.4
      with:
        tagRegex: "B(\\d+)"
      
    - name: AVD3Release-CompressAsset
      run: |
        cd ${{ github.workspace }}/AVDump3CL
        zip -r ${{ github.workspace }}/AVDump3CL-B${{ steps.avd3releasegettag.outputs.tag }}.zip *
     
    - name: AVD3Release-Create
      id: avd3releasecreate
      uses: softprops/action-gh-release@v2
      with:
        name: Build ${{ steps.avd3releasegettag.outputs.tag }}
        draft: false
        prerelease: false
        files: ${{ github.workspace }}/AVDump3CL-B${{ steps.avd3releasegettag.outputs.tag }}.zip
