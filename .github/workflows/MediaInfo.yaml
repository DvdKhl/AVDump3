name: MediaInfo

on:
  workflow_dispatch:
  push:
    branches: [ NET10, mediainfo ]

env:
  MEDIAINFO_VERSION: '25.09'
  MEDIAINFO_BASE_URL: https://mediaarea.net/download/source/libmediainfo
  # Runner labels and build constants (cannot be used in runs-on via env)
  MACOS_RUNNER: macos-15
  UBUNTU_RUNNER_X64: ubuntu-latest
  UBUNTU_RUNNER_ARM64: ubuntu-24.04-arm
  DOCKER_ALPINE_X64: alpine:3.12
  DOCKER_ALPINE_ARM64: arm64v8/alpine:3.12
  DOCKER_MANYLINUX_X64: quay.io/pypa/manylinux2014_x86_64
  DOCKER_UBUNTU_ARM64: arm64v8/ubuntu:22.04
  MACOSX_MIN_X64: '10.13'
  MACOSX_MIN_ARM64: '11.0'
  MAC_LDFLAGS: -Wl,-x

jobs:
  prepare-mediainfo:
    runs-on: ubuntu-latest

    steps:
    - name: Check out MediaInfo
      run: |
        curl -LOSs \
          "$MEDIAINFO_BASE_URL/${MEDIAINFO_VERSION}/libmediainfo_${MEDIAINFO_VERSION}_AllInclusive.7z"
        7z x "libmediainfo_${MEDIAINFO_VERSION}_AllInclusive.7z"

    - name: Create UNIX build script
      working-directory: libmediainfo_AllInclusive
      run: |
        cat > build.sh <<'EOF'
        #!/bin/sh -e

        # Defaults for portability across environments
        : "${NPROC:=$( (command -v nproc >/dev/null 2>&1 && nproc) || (sysctl -n hw.ncpu 2>/dev/null) || echo 1 )}"
        : "${SOEXT:=so}"
        : "${RID:=unknown}"
        : "${LDFLAGS:=}"

        mkdir MediaInfoLib/Project/CMake/build
        cd MediaInfoLib/Project/CMake/build

        # Switch off external packages so they are not accidentally picked up from the build host.
        # LTO (IPO) and hidden visibility both save space and improve MediaInfo's performance.
        # MediaInfo doesn't use RTTI (typeid & dynamic_cast), so omit it to save space.
        # We'll only load the library at runtime, so we can save a few bytes on macOS install_name.
        EXTRA_ARCH=""
        [ -n "$ARCH" ] && EXTRA_ARCH="-DCMAKE_OSX_ARCHITECTURES=$ARCH"

        cmake .. \
          -DCMAKE_RULE_MESSAGES=OFF \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_TinyXML=ON \
          -DBUILD_ZENLIB=ON \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
          -DCMAKE_C_VISIBILITY_PRESET=hidden \
          -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
          -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
          -DCMAKE_CXX_FLAGS="-fno-rtti" \
          -DCMAKE_INSTALL_NAME_DIR="" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LDFLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
          $EXTRA_ARCH \
          ${CC:+-DCMAKE_C_COMPILER=$CC} \
          ${CXX:+-DCMAKE_CXX_COMPILER=$CXX} \
          ${AR:+-DCMAKE_AR=$AR} \
          ${RANLIB:+-DCMAKE_RANLIB=$RANLIB} \
          ${LD:+-DCMAKE_LINKER=$LD} \
          "$@"
        make -j$NPROC

        # Resolve the built library path in a robust way across platforms
        # Prefer a symlink named libmediainfo.<ext> if present, else take the first match
        cand="./libmediainfo.$SOEXT"
        if [ ! -e "$cand" ]; then
          # Linux often has versioned names like libmediainfo.so.0.XXXX
          cand=$(ls -1 ./libmediainfo.*$SOEXT* 2>/dev/null | head -n1 || true)
        fi

        if [ -z "$cand" ] || [ ! -e "$cand" ]; then
          echo "Could not locate built libmediainfo (SOEXT=$SOEXT)" >&2
          exit 1
        fi

        # Follow symlinks (portable): iterate readlink until it is not a link
        fullname="$cand"
        while target=$(readlink "$fullname" 2>/dev/null); do
          case "$target" in
            /*) fullname="$target" ;;
            *)  fullname=${fullname%/*}/$target ;;
          esac
        done

        mv "$fullname" ../../../../MediaInfo-$RID.$SOEXT
        EOF
        chmod +x build.sh

    - name: Pack MediaInfo
      run: |
        tar cJf libmediainfo_AllInclusive.tar.xz libmediainfo_AllInclusive

    - name: Upload prepared MediaInfo source artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.src
        path: libmediainfo_AllInclusive.tar.xz

  build-mediainfo-win:
    needs: prepare-mediainfo
    name: build-mediainfo-${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64]

    steps:
    - name: Download prepared MediaInfo source artifact
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.src

    - name: Unpack MediaInfo source
      shell: sh
      run: |
        tar xJf libmediainfo_AllInclusive.tar.xz
        mv libmediainfo_AllInclusive/* .

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build MediaInfo
      run: >
        msbuild MediaInfoLib\Project\MSVC2022\MediaInfoLib.sln
        /m /t:MediaInfoDll /p:Configuration=Release /p:Platform=x64

    - name: Upload MediaInfo binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.${{ matrix.rid }}
        path: MediaInfoLib\Project\MSVC2022\x64\Release\MediaInfo.dll

  build-mediainfo-osx:
    needs: prepare-mediainfo
    name: build-mediainfo-${{ matrix.rid }}
    runs-on: macos-15  # needed for ARM support in system headers
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: osx-x64
          arch: x86_64
          # Match .NET Core's target version from:
          # https://github.com/dotnet/runtime/blob/main/eng/native/configurecompiler.cmake
          macosx_version_min: '10.13'

        - rid: osx-arm64
          arch: arm64
          macosx_version_min: '11.0'

    steps:
    - name: Download prepared MediaInfo source artifact
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.src

    - name: Unpack MediaInfo source
      run: |
        tar xJf libmediainfo_AllInclusive.tar.xz
        mv libmediainfo_AllInclusive/* .

    - name: Build MediaInfo
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_version_min }}
        ARCH: ${{ matrix.arch }}
        RID: ${{ matrix.rid }}
        SOEXT: dylib
        # Ask `ld` to strip out non-global symbols to save space:
        # `strip` won't work, and the compiler doesn't understand `-s`.
        LDFLAGS: ${{ env.MAC_LDFLAGS }}
      run: |
        NPROC=$(sysctl -n hw.ncpu) ./build.sh

    - name: Upload MediaInfo binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.${{ matrix.rid }}
        path: ${{ github.workspace }}/MediaInfo-${{ matrix.rid }}.dylib

  build-mediainfo-linux:
    needs: prepare-mediainfo
    name: build-mediainfo-${{ matrix.rid }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu
          rid: linux-musl-x64
          runs_on: ubuntu-latest
          docker_image: alpine:3.12

        - os: ubuntu
          rid: linux-musl-arm64
          runs_on: ubuntu-24.04-arm
          docker_image: arm64v8/alpine:3.12

        - os: ubuntu
          rid: linux-x64
          runs_on: ubuntu-latest
          docker_image: quay.io/pypa/manylinux2014_x86_64
          # manylinux2014 (CentOS 7 baseline) for wide glibc compatibility.
          # Keep GCC toolchain to preserve oldest glibc/libstdc++ ABI surface for legacy x64 systems.

        - os: ubuntu
          rid: linux-arm64
          runs_on: ubuntu-24.04-arm
          docker_image: arm64v8/ubuntu:22.04
          # Modern glibc environment on ARM64; compatibility with very old systems is not required

    steps:
    - name: Download prepared MediaInfo source artifact
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.src

    - name: Unpack MediaInfo source
      shell: bash
      run: |
        tar xJf libmediainfo_AllInclusive.tar.xz
        mv libmediainfo_AllInclusive/* .

    - name: Build MediaInfo (containerized where needed)
      shell: bash
      run: |
        set -euo pipefail
        RID="${{ matrix.rid }}"
        echo "Building for RID=$RID"
        case "$RID" in
          linux-musl-x64)
            docker run --rm -v "${PWD}:/work" -w /work alpine:3.12 sh -lc '
              set -e
              apk add --no-cache cmake g++ make zlib-dev clang lld coreutils findutils binutils
              export CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib LD=ld.lld
              NPROC=$(nproc)
              # Disable LTO on musl for toolchain simplicity; re-enable later if needed
              LDFLAGS=""
              [ -f /work/libmediainfo.map ] && LDFLAGS="$LDFLAGS -Wl,--version-script,/work/libmediainfo.map"
              RID=linux-musl-x64 SOEXT=so NPROC=$NPROC LDFLAGS="$LDFLAGS" ./build.sh
            '
            ;;
          linux-musl-arm64)
            docker run --rm -v "${PWD}:/work" -w /work arm64v8/alpine:3.12 sh -lc '
              set -e
              apk add --no-cache cmake g++ make zlib-dev clang lld coreutils findutils binutils
              export CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib LD=ld.lld
              NPROC=$(nproc)
              # Disable LTO on musl for toolchain simplicity; re-enable later if needed
              LDFLAGS=""
              [ -f /work/libmediainfo.map ] && LDFLAGS="$LDFLAGS -Wl,--version-script,/work/libmediainfo.map"
              RID=linux-musl-arm64 SOEXT=so NPROC=$NPROC LDFLAGS="$LDFLAGS" ./build.sh
            '
            ;;
          linux-x64)
            docker run --rm -v "${PWD}:/work" -w /work quay.io/pypa/manylinux2014_x86_64 sh -lc '
              set -e
              PIP=$(ls -1d /opt/python/cp3*/bin/pip 2>/dev/null | sort | tail -n1)
              if [ -z "$PIP" ]; then echo "No pip under /opt/python; unexpected manylinux image" >&2; exit 1; fi
              "$PIP" install --no-cache-dir cmake
              export PATH="$(dirname "$PIP"):$PATH"
              NPROC=$(nproc)
              # GCC supports -flto, avoid job count for broader compatibility
              LDFLAGS="-flto"
              [ -f /work/libmediainfo.map ] && LDFLAGS="$LDFLAGS -Wl,--version-script,/work/libmediainfo.map"
              RID=linux-x64 SOEXT=so NPROC=$NPROC LDFLAGS="$LDFLAGS" ./build.sh
            '
            ;;
          linux-arm64)
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ca-certificates \
              cmake \
              clang \
              lld \
              make \
              libstdc++-dev \
              zlib1g-dev
            sudo update-ca-certificates || true
            export CC=clang CXX=clang++ AR=llvm-ar RANLIB=llvm-ranlib LD=ld.lld
            NPROC=$(nproc)
            # clang 14+ on Ubuntu 22.04 supports -flto; no job count here
            LDFLAGS="-flto -Wl,--threads"
            [ -f "${PWD}/libmediainfo.map" ] && LDFLAGS="$LDFLAGS -Wl,--version-script,${PWD}/libmediainfo.map"
            RID=linux-arm64 SOEXT=so NPROC=$NPROC LDFLAGS="$LDFLAGS" ./build.sh
            ;;
        esac

    - name: Discard symbol table  # to save space
      run: |
        file="MediaInfo-${{ matrix.rid }}.so"
        [ -f "$file" ] && strip "$file" || true

    - name: Upload MediaInfo binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.${{ matrix.rid }}
        path: ${{ github.workspace }}/MediaInfo-${{ matrix.rid }}.so

  lipo-mediainfo:
    needs: build-mediainfo-osx
    runs-on: macos-15
    steps:
    - name: Download Intel build
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.osx-x64

    - name: Download ARM build
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.osx-arm64

    - name: Create universal binary
      run: |
        lipo -create MediaInfo-*.dylib -output MediaInfo.dylib

    - name: Upload universal binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.osx-universal
        path: ${{ github.workspace }}/MediaInfo.dylib
