name: MediaInfo

on:
  workflow_dispatch:
  push:
    branches: [ mediainfo ]

jobs:
  prepare-mediainfo:
    runs-on: ubuntu-latest
    env:
      MEDIAINFO_VERSION: 25.09
      MEDIAINFO_BASE_URL: https://mediaarea.net/download/source/libmediainfo
      MACOS_RUNNER: macos-15
      UBUNTU_RUNNER_X64: ubuntu-latest
      UBUNTU_RUNNER_ARM64: ubuntu-24.04-arm
      DOCKER_ALPINE_X64: alpine:3.12
      DOCKER_ALPINE_ARM64: arm64v8/alpine:3.12
      DOCKER_MANYLINUX_X64: quay.io/pypa/manylinux2014_x86_64
      DOCKER_UBUNTU_ARM64: arm64v8/ubuntu:22.04
      MACOSX_MIN_X64: '10.13'
      MACOSX_MIN_ARM64: '11.0'
      MAC_LDFLAGS: -Wl,-x

    steps:
    - name: Check out MediaInfo
      run: |
        curl -LOSs \
          "$MEDIAINFO_BASE_URL/${MEDIAINFO_VERSION}/libmediainfo_${MEDIAINFO_VERSION}_AllInclusive.7z"
        7z x "libmediainfo_${MEDIAINFO_VERSION}_AllInclusive.7z"

    - name: Create UNIX build script
      working-directory: libmediainfo_AllInclusive
      run: |
        cat > build.sh <<'EOF'
        #!/bin/sh -e

        mkdir MediaInfoLib/Project/CMake/build
        cd MediaInfoLib/Project/CMake/build

        # Switch off external packages so they are not accidentally picked up from the build host.
        # LTO (IPO) and hidden visibility both save space and improve MediaInfo's performance.
        # MediaInfo doesn't use RTTI (typeid & dynamic_cast), so omit it to save space.
        # We'll only load the library at runtime, so we can save a few bytes on macOS install_name.
        cmake .. \
          -DCMAKE_RULE_MESSAGES=OFF \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_TinyXML=ON \
          -DBUILD_ZENLIB=ON \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
          -DCMAKE_C_VISIBILITY_PRESET=hidden \
          -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
          -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
          -DCMAKE_CXX_FLAGS="-fno-rtti" \
          -DCMAKE_OSX_ARCHITECTURES="$ARCH" \
          -DCMAKE_INSTALL_NAME_DIR="" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
          "$@"
        make -j$NPROC

        fullname=./libmediainfo.$SOEXT
        while target=$(readlink "$fullname"); do fullname=${fullname%/*}/$target; done
        mv "$fullname" ../../../../MediaInfo-$RID.$SOEXT
        EOF
        chmod +x build.sh

    - name: Pack MediaInfo
      run: |
        tar cJf libmediainfo_AllInclusive.tar.xz libmediainfo_AllInclusive

    - name: Upload prepared MediaInfo source artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.src
        path: libmediainfo_AllInclusive.tar.xz

  build-mediainfo-win:
    needs: prepare-mediainfo
    name: build-mediainfo-${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64]

    steps:
    - name: Download prepared MediaInfo source artifact
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.src

    - name: Unpack MediaInfo source
      shell: sh
      run: |
        tar xJf libmediainfo_AllInclusive.tar.xz
        mv libmediainfo_AllInclusive/* .

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build MediaInfo
      run: >
        msbuild MediaInfoLib\Project\MSVC2022\MediaInfoLib.sln
        /m /t:MediaInfoDll /p:Configuration=Release /p:Platform=x64

    - name: Upload MediaInfo binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.${{ matrix.rid }}
        path: MediaInfoLib\Project\MSVC2022\x64\Release\MediaInfo.dll

  build-mediainfo-osx:
    needs: prepare-mediainfo
    name: build-mediainfo-${{ matrix.rid }}
    runs-on: ${{ env.MACOS_RUNNER }}  # needed for ARM support in system headers
    strategy:
      fail-fast: false
      matrix:
        include:
        - rid: osx-x64
          arch: x86_64
          # Match .NET Core's target version from:
          # https://github.com/dotnet/runtime/blob/main/eng/native/configurecompiler.cmake
          macosx_version_min: ${{ env.MACOSX_MIN_X64 }}

        - rid: osx-arm64
          arch: arm64
          macosx_version_min: ${{ env.MACOSX_MIN_ARM64 }}

    steps:
    - name: Download prepared MediaInfo source artifact
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.src

    - name: Unpack MediaInfo source
      run: |
        tar xJf libmediainfo_AllInclusive.tar.xz
        mv libmediainfo_AllInclusive/* .

    - name: Build MediaInfo
      env:
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_version_min }}
        ARCH: ${{ matrix.arch }}
        RID: ${{ matrix.rid }}
        SOEXT: dylib
        # Ask `ld` to strip out non-global symbols to save space:
        # `strip` won't work, and the compiler doesn't understand `-s`.
        LDFLAGS: ${{ env.MAC_LDFLAGS }}
      run: |
        NPROC=$(sysctl -n hw.ncpu) ./build.sh

    - name: Upload MediaInfo binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.${{ matrix.rid }}
        path: ${{ github.workspace }}/MediaInfo-${{ matrix.rid }}.dylib

  build-mediainfo-linux:
    needs: prepare-mediainfo
    name: build-mediainfo-${{ matrix.rid }}
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.docker_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu
          rid: linux-musl-x64
          runs_on: ${{ env.UBUNTU_RUNNER_X64 }}
          docker_image: ${{ env.DOCKER_ALPINE_X64 }}

        - os: ubuntu
          rid: linux-musl-arm64
          runs_on: ${{ env.UBUNTU_RUNNER_ARM64 }}
          docker_image: ${{ env.DOCKER_ALPINE_ARM64 }}

        - os: ubuntu
          rid: linux-x64
          runs_on: ${{ env.UBUNTU_RUNNER_X64 }}
          docker_image: ${{ env.DOCKER_MANYLINUX_X64 }}
          # manylinux2014 (CentOS 7 baseline) for wide glibc compatibility.
          # Keep GCC toolchain to preserve oldest glibc/libstdc++ ABI surface for legacy x64 systems.

        - os: ubuntu
          rid: linux-arm64
          runs_on: ${{ env.UBUNTU_RUNNER_ARM64 }}
          docker_image: ${{ env.DOCKER_UBUNTU_ARM64 }}
          # Modern glibc environment on ARM64; compatibility with very old systems is not required

    defaults:
      run:
        shell: sh -e {0}

    steps:
    - name: Download prepared MediaInfo source artifact
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.src

    - name: Unpack MediaInfo source
      shell: sh
      run: |
        tar xJf libmediainfo_AllInclusive.tar.xz
        mv libmediainfo_AllInclusive/* .

    - name: Install build dependencies
      run: |
        case "${{ matrix.rid }}" in
          linux-musl*)
            apk add --no-cache cmake g++ make zlib-dev clang lld
            # clang toolchain for musl
            {
              echo 'CC=clang'
              echo 'CXX=clang++'
              echo 'AR=llvm-ar'
              echo 'RANLIB=llvm-ranlib'
              echo 'LD=ld.lld'
            } >> "$GITHUB_ENV"
            ;;
          linux-x64)
            # Install latest CMake via the newest bundled CPython's pip
            PIP=$(ls -1d /opt/python/cp3*/bin/pip 2>/dev/null | sort | tail -n1)
            if [ -z "$PIP" ]; then
              echo "No pip under /opt/python; unexpected manylinux image" >&2
              exit 1
            fi
            "$PIP" install --no-cache-dir cmake
            PIPDIR=$(dirname "$PIP")
            echo "PATH=$PIPDIR:$PATH" >> "$GITHUB_ENV"
            ;;
          linux-arm64)
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates \
              cmake \
              clang \
              lld \
              make \
              libstdc++-dev \
              zlib1g-dev
            update-ca-certificates || true
            {
              echo 'CC=clang'
              echo 'CXX=clang++'
              echo 'AR=llvm-ar'
              echo 'RANLIB=llvm-ranlib'
              echo 'LD=ld.lld'
            } >> "$GITHUB_ENV"
            ;;
        esac

    - name: Build MediaInfo
      run: |
        # Parallelism: use all available cores inside the container
        NPROC=$(nproc)
        RID=${{ matrix.rid }}
        SOEXT=so

        # Common LTO flags
        LDFLAGS="-flto=$NPROC"
        VSCRIPT="${{ github.workspace }}/libmediainfo.map"
        [ -f "$VSCRIPT" ] && LDFLAGS="$LDFLAGS -Wl,--version-script,$VSCRIPT"

        # Diagnostics
        echo "CC: ${CC:-$(command -v cc || true)}"
        echo "CXX: ${CXX:-$(command -v c++ || true)}"
        { command -v "${CC:-cc}" >/dev/null 2>&1 && "${CC:-cc}" --version || true; } | head -n1
        { command -v "${CXX:-c++}" >/dev/null 2>&1 && "${CXX:-c++}" --version || true; } | head -n1

        ./build.sh

    - name: Discard symbol table  # to save space
      run: |
        strip MediaInfo-${{ matrix.rid }}.so || true

    - name: Upload MediaInfo binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.${{ matrix.rid }}
        path: ${{ github.workspace }}/MediaInfo-${{ matrix.rid }}.so

  lipo-mediainfo:
    needs: build-mediainfo-osx
    runs-on: macos-15
    steps:
    - name: Download Intel build
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.osx-x64

    - name: Download ARM build
      uses: actions/download-artifact@v4
      with:
        name: MediaInfo.osx-arm64

    - name: Create universal binary
      run: |
        lipo -create MediaInfo-*.dylib -output MediaInfo.dylib

    - name: Upload universal binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaInfo.osx-universal
        path: ${{ github.workspace }}/MediaInfo.dylib
